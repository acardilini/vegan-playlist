<!DOCTYPE html>
<html lang="en">

<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0">
  <div class="py-1.5 space-y-2">
    <!-- Top bar: Demo track switcher + interactive toggle buttons doubling as legend -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-[var(--card-border)]">
      <div id="track-tabs" class="flex flex-wrap items-center gap-1.5" role="tablist" aria-label="Sample tracks"></div>
      <div class="flex items-center gap-2">
        <button id="btn-grit" type="button" aria-pressed="true"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium border transition-opacity cursor-pointer">
          <svg width="18" height="8" viewBox="0 0 18 8" aria-hidden="true">
            <line id="swatch-grit-line" x1="1" y1="4" x2="17" y2="4" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <span>Grit</span>
        </button>
        <button id="btn-pulse" type="button" aria-pressed="true"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium border transition-opacity cursor-pointer">
          <svg width="18" height="8" viewBox="0 0 18 8" aria-hidden="true">
            <line id="swatch-pulse-line" x1="1" y1="4" x2="17" y2="4" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round" />
          </svg>
          <span>Beat Pulse</span>
        </button>
      </div>
    </div>

    <!-- Interactive Sonic Ribbon + Grit / Beat Pulse Canvas -->
    <div class="relative w-full">
      <canvas id="timeline-canvas"
        tabindex="0"
        role="slider"
        aria-label="Audio structure timeline"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        class="w-full block cursor-crosshair focus:outline-none focus:ring-1 focus:ring-[var(--primary)] rounded"
        style="height: 152px; touch-action: pan-y;"></canvas>
    </div>

    <!-- Compact Live Scrub Readout + Clip Jump Controls (NO bottom legends, NO song header metadata) -->
    <div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 border-t border-[var(--card-border)] text-xs">
      <div class="flex flex-wrap items-center gap-3 tabular-nums">
        <span id="readout-time" class="font-mono font-semibold text-[var(--foreground)]">0:00 / 0:00</span>
        <span class="text-[var(--muted-foreground)]">Loudness <strong id="val-loud" class="text-[var(--foreground)] font-medium">0%</strong></span>
        <span id="wrap-val-grit" class="text-[var(--muted-foreground)]">Grit <strong id="val-grit" class="font-medium">0%</strong></span>
        <span id="wrap-val-pulse" class="text-[var(--muted-foreground)]">Pulse <strong id="val-pulse" class="font-medium">0%</strong></span>
      </div>
      <div class="flex items-center gap-1.5">
        <div id="clip-pills" class="flex flex-wrap items-center gap-1"></div>
        <span id="pin-hint" class="text-xs text-[var(--muted-foreground)] hidden sm:inline">Hover to inspect · Click to pin</span>
      </div>
    </div>

    <!-- Time-aligned Breakdown: Section + Sample / Advocacy Callout -->
    <div class="space-y-1.5 pt-1 border-t border-[var(--card-border)] text-xs">
      <div class="flex items-baseline gap-2 leading-snug">
        <span id="section-range" class="font-mono shrink-0 font-semibold text-[var(--primary)]">Section</span>
        <span id="section-desc" class="text-[var(--foreground)] line-clamp-2"></span>
      </div>

      <div id="sample-card" class="pl-2.5 border-l-2 space-y-0.5 leading-snug">
        <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5">
          <span id="sample-badge" class="font-semibold"></span>
          <span id="sample-time" class="font-mono text-[var(--muted-foreground)]"></span>
          <span id="sample-speaker" class="font-semibold text-[var(--foreground)]"></span>
        </div>
        <p id="sample-desc" class="text-[var(--muted-foreground)] line-clamp-1 m-0"></p>
        <blockquote id="sample-quote" class="italic text-[var(--foreground)] m-0 line-clamp-2"></blockquote>
      </div>
    </div>
  </div>

    function toSec(mmss) {
      const m = /^(\d+):(\d{2})$/.exec(mmss.trim());
      return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : 0;
    }

    function fmtTime(sec) {
      const s = Math.max(0, Math.round(sec));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function parseRange(str) {
      const m = /^(\d+:\d{2})(?:\s*[-–]\s*(\d+:\d{2}))?/.exec((str || '').trim());
      if (!m) return { start: 0, end: 0 };
      const start = toSec(m[1]);
      const end = m[2] ? Math.max(start + 1, toSec(m[2])) : start + 5;
      return { start, end };
    }

    function parseSections(evList, dur) {
      return (evList || []).map((line) => {
        const m = /^(\d+:\d{2})(?:\s*[-–]\s*(\d+:\d{2}))?(?::\s*|\s+)(.+)$/.exec(line.trim());
        if (!m) return { start: 0, end: dur, label: '0:00–' + fmtTime(dur), text: line };
        const start = toSec(m[1]);
        const end = m[2] ? toSec(m[2]) : dur;
        return { start, end, label: m[2] ? `${m[1]}–${m[2]}` : m[1], text: m[3] };
      });
    }

    function palette() {
      const isLight = document.documentElement.classList.contains('light');
      const cs = getComputedStyle(document.documentElement);
      const fg = cs.getPropertyValue('--foreground').trim() || (isLight ? '#171717' : '#f5f5f5');
      const muted = cs.getPropertyValue('--muted-foreground').trim() || (isLight ? '#525252' : '#a3a3a3');
      const border = cs.getPropertyValue('--card-border').trim() || (isLight ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.14)');
      const bgHalo = isLight ? 'rgba(255,255,255,0.72)' : 'rgba(18,18,20,0.72)';
      // High-contrast CVD-safe accents (Vermilion vs Cerulean + Orchid spans)
      return isLight
        ? {
            isLight, fg, muted, border, bgHalo,
            ribbonFillTop: 'rgba(51, 88, 168, 0.22)',
            ribbonFillBot: 'rgba(51, 88, 168, 0.34)',
            ribbonStroke: 'rgba(37, 68, 138, 0.55)',
            grit: '#d9480f',       // Deep Vermilion Orange (high contrast on light)
            pulse: '#0072b2',      // Okabe-Ito Blue (CVD-safe contrast with Vermilion)
            sampleFill: 'rgba(176, 24, 122, 0.13)',
            sampleHatch: 'rgba(176, 24, 122, 0.24)',
            sampleStroke: '#b0187a',
            cursor: fg,
          }
        : {
            isLight, fg, muted, border, bgHalo,
            ribbonFillTop: 'rgba(112, 142, 205, 0.24)',
            ribbonFillBot: 'rgba(70, 118, 232, 0.38)',
            ribbonStroke: 'rgba(147, 178, 245, 0.55)',
            grit: '#ff7a33',       // Luminous Vermilion-Ember (high contrast on dark)
            pulse: '#38bdf8',      // Luminous Sky Cyan-Blue (CVD-safe contrast with Vermilion)
            sampleFill: 'rgba(244, 114, 182, 0.14)',
            sampleHatch: 'rgba(244, 114, 182, 0.24)',
            sampleStroke: '#f472b6',
            cursor: fg,
          };
    }

    let state = {
      trackIdx: 1, // Default to Ed Winters track with 5 clips
      showGrit: true,
      showPulse: true,
      hoverBin: null,
      pinnedBin: 24, // Start focused on first mid-song Ed Winters clip (0:44-0:53 ~ bin 20)

    const canvas = document.getElementById('timeline-canvas');

    function currentTrack() {
      const t = TRACKS[state.trackIdx];
      return {
        ...t,
        sections: parseSections(t.sonic_evidence, t.timeline.duration_sec),
        samples: t.sample_details.map((s) => ({ ...s, ...parseRange(s.timestamp) })),

    function activeBin(track) {
      if (state.hoverBin !== null) return state.hoverBin;
      if (state.pinnedBin !== null) return state.pinnedBin;

    function selectTrack(idx) {
      state.trackIdx = idx;

      if (t.samples.length > 0) {
        const midSec = (t.samples[0].start + t.samples[0].end) / 2;
        state.pinnedBin = Math.max(0, Math.min(t.timeline.bins - 1, Math.floor(midSec / t.timeline.bin_sec)));
      } else {
        state.pinnedBin = 0;
      }
      renderControls();
      draw();
      updateDetails();
    }

    function renderControls() {
      const p = palette();
      const tabs = document.getElementById('track-tabs');
      tabs.innerHTML = '';
      TRACKS.forEach((tr, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = tr.tabLabel;
        const active = i === state.trackIdx;
        b.className = 'px-2.5 py-1 rounded text-xs font-medium border transition-colors cursor-pointer';
        b.style.borderColor = active ? 'var(--primary)' : 'var(--card-border)';
        b.style.background = active ? 'var(--card)' : 'transparent';
        b.style.color = active ? 'var(--foreground)' : 'var(--muted-foreground)';
        b.setAttribute('aria-selected', String(active));
        b.onclick = () => selectTrack(i);
        tabs.appendChild(b);
      });

      const bg = document.getElementById('btn-grit');
      const bp = document.getElementById('btn-pulse');
      document.getElementById('swatch-grit-line').setAttribute('stroke', p.grit);
      document.getElementById('swatch-pulse-line').setAttribute('stroke', p.pulse);
      document.getElementById('val-grit').style.color = p.grit;
      document.getElementById('val-pulse').style.color = p.pulse;

      bg.setAttribute('aria-pressed', String(state.showGrit));
      bg.style.borderColor = state.showGrit ? p.grit : 'var(--card-border)';
      bg.style.opacity = state.showGrit ? '1' : '0.45';
      document.getElementById('wrap-val-grit').style.opacity = state.showGrit ? '1' : '0.45';

      bp.setAttribute('aria-pressed', String(state.showPulse));
      bp.style.borderColor = state.showPulse ? p.pulse : 'var(--card-border)';
      bp.style.opacity = state.showPulse ? '1' : '0.45';
      document.getElementById('wrap-val-pulse').style.opacity = state.showPulse ? '1' : '0.45';
    }

    function drawCurve(pts, color, dashed, haloColor) {
      if (pts.length < 2) return;
      const trace = () => {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 0; i < pts.length - 1; i++) {
          const xc = (pts[i][0] + pts[i + 1][0]) / 2;
          const yc = (pts[i][1] + pts[i + 1][1]) / 2;
          ctx.quadraticCurveTo(pts[i][0], pts[i][1], xc, yc);
        }
        ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      };
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.setLineDash(dashed ? [6, 4] : []);
      ctx.strokeStyle = haloColor;
      ctx.lineWidth = 4.5;
      trace();
      ctx.stroke();

      ctx.strokeStyle = color;
      ctx.lineWidth = 2.3;
      trace();
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(300, rect.width);
      const h = rect.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const p = palette();
      const t = currentTrack();
      const tl = t.timeline;
      const n = tl.bins;
      const padL = 8, padR = 8, padT = 10, padB = 22;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;
      const midY = padT + plotH / 2;
      const halfMax = plotH * 0.44;
      const binW = plotW / n;

      ctx.clearRect(0, 0, w, h);

      // Subtle horizontal reference grid
      ctx.save();
      ctx.strokeStyle = p.border;
      ctx.lineWidth = 1;
      [0.25, 0.5, 0.75].forEach((f) => {
        const y = Math.round(padT + plotH * (1 - f)) + 0.5;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(w - padR, y);
        ctx.stroke();
      });
      ctx.restore();

      // Sample / advocacy highlighted vertical spans with diagonal hatch (dual encoding)
      t.samples.forEach((s) => {
        const x1 = padL + (s.start / tl.duration_sec) * plotW;
        const x2 = Math.max(x1 + 4, padL + (s.end / tl.duration_sec) * plotW);
        const sw = x2 - x1;
        ctx.save();
        ctx.fillStyle = p.sampleFill;
        ctx.fillRect(x1, padT, sw, plotH);

        // Diagonal hatch clipped inside span
        ctx.beginPath();
        ctx.rect(x1, padT, sw, plotH);
        ctx.clip();
        ctx.strokeStyle = p.sampleHatch;
        ctx.lineWidth = 1.2;
        for (let hx = x1 - plotH; hx < x2 + plotH; hx += 8) {
          ctx.beginPath();
          ctx.moveTo(hx, padT + plotH);
          ctx.lineTo(hx + plotH * 0.65, padT);
          ctx.stroke();
        }
        ctx.restore();

        // Crisp top bar indicator per sample span
        ctx.save();
        ctx.fillStyle = p.sampleStroke;
        ctx.fillRect(x1, padT, sw, 4);
        ctx.restore();
      });

      // Sonic evidence section vertical dividers
      ctx.save();
      ctx.strokeStyle = p.border;
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1;
      t.sections.forEach((sec, idx) => {
        if (idx === 0 || sec.start <= 0) return;
        const sx = Math.round(padL + (sec.start / tl.duration_sec) * plotW) + 0.5;
        ctx.beginPath();
        ctx.moveTo(sx, padT);
        ctx.lineTo(sx, padT + plotH);
        ctx.stroke();
      });
      ctx.restore();

      // Mirrored Sonic Ribbon (loudness envelope)
      const grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
      grad.addColorStop(0, p.ribbonFillBot);
      grad.addColorStop(0.5, p.ribbonFillTop);
      grad.addColorStop(1, p.ribbonFillBot);

      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const x = padL + (i + 0.5) * binW;
        const amp = Math.max(1.5, tl.loudness[i] * halfMax);
        const y = midY - amp;
        if (i === 0) ctx.moveTo(padL, midY - amp);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w - padR, midY - Math.max(1.5, tl.loudness[n - 1] * halfMax));
      for (let i = n - 1; i >= 0; i--) {
        const x = padL + (i + 0.5) * binW;
        const amp = Math.max(1.5, tl.loudness[i] * halfMax);
        ctx.lineTo(x, midY + amp);
      }
      ctx.lineTo(padL, midY + Math.max(1.5, tl.loudness[0] * halfMax));
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = p.ribbonStroke;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      // Overlaid Grit (solid) and Beat Pulse (dashed) curves from bottom baseline -> top (0..100%)
      if (state.showPulse) {
        const pulsePts = tl.pulse.map((v, i) => [padL + (i + 0.5) * binW, padT + plotH * (1 - v * 0.94) - 2]);
        drawCurve(pulsePts, p.pulse, true, p.bgHalo);
      }
      if (state.showGrit) {
        const gritPts = tl.grit.map((v, i) => [padL + (i + 0.5) * binW, padT + plotH * (1 - v * 0.94) - 2]);
        drawCurve(gritPts, p.grit, false, p.bgHalo);
      }

      // Active scrubber cursor
      const idx = activeBin(t);
      const cx = padL + (idx + 0.5) * binW;
      ctx.save();
      ctx.strokeStyle = p.cursor;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(cx, padT);
      ctx.lineTo(cx, padT + plotH);
      ctx.stroke();
      ctx.fillStyle = p.cursor;
      ctx.beginPath();
      ctx.arc(cx, padT + 4, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Clean 12px time ticks
      ctx.save();
      ctx.fillStyle = p.muted;
      ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillText('0:00', padL, padT + plotH + 5);
      ctx.textAlign = 'center';
      ctx.fillText(fmtTime(tl.duration_sec / 2), padL + plotW / 2, padT + plotH + 5);
      ctx.textAlign = 'right';
      ctx.fillText(fmtTime(tl.duration_sec), w - padR, padT + plotH + 5);
      ctx.restore();
    }

    function updateDetails() {
      const p = palette();
      const t = currentTrack();
      const tl = t.timeline;
      const idx = activeBin(t);
      const sec = Math.min(tl.duration_sec, (idx + 0.5) * tl.bin_sec);

      canvas.setAttribute('aria-valuemax', String(Math.round(tl.duration_sec)));
      canvas.setAttribute('aria-valuenow', String(Math.round(sec)));
      canvas.setAttribute('aria-valuetext', `${fmtTime(sec)} of ${fmtTime(tl.duration_sec)}`);

      document.getElementById('readout-time').textContent = `${fmtTime(sec)} / ${fmtTime(tl.duration_sec)}`;
      document.getElementById('val-loud').textContent = `${Math.round(tl.loudness[idx] * 100)}%`;
      document.getElementById('val-grit').textContent = `${Math.round(tl.grit[idx] * 100)}%`;
      document.getElementById('val-pulse').textContent = `${Math.round(tl.pulse[idx] * 100)}%`;
      document.getElementById('pin-hint').textContent =
        state.hoverBin !== null ? 'Hovering · Click to pin' : 'Pinned · Click chart to move';

      // Active section
      const activeSec =
        t.sections.find((s) => sec >= s.start && sec <= s.end) ||
        t.sections.reduce((best, s) => (Math.abs(s.start - sec) < Math.abs(best.start - sec) ? s : best), t.sections[0]);
      if (activeSec) {
        document.getElementById('section-range').textContent = activeSec.label;
        document.getElementById('section-desc').textContent = activeSec.text;
      }

      // Active sample or closest sample
      let activeSample = t.samples.find((s) => sec >= s.start - 1.5 && sec <= s.end + 1.5);
      const sampleHit = Boolean(activeSample);
      if (!activeSample && t.samples.length > 0) {
        activeSample = t.samples.reduce((best, s) => {
          const dBest = Math.abs((best.start + best.end) / 2 - sec);
          const dCur = Math.abs((s.start + s.end) / 2 - sec);
          return dCur < dBest ? s : best;
        }, t.samples[0]);
      }

      // Clip jump pills
      const pillsWrap = document.getElementById('clip-pills');
      pillsWrap.innerHTML = '';
      if (t.samples.length > 1) {
        t.samples.forEach((s, si) => {
          const pb = document.createElement('button');
          pb.type = 'button';
          const isCur = activeSample === s && sampleHit;
          pb.textContent = `Clip ${si + 1}`;
          pb.className = 'px-1.5 py-0.5 rounded text-xs border cursor-pointer';
          pb.style.borderColor = isCur ? p.sampleStroke : 'var(--card-border)';
          pb.style.color = isCur ? p.sampleStroke : 'var(--muted-foreground)';
          pb.onclick = () => {
            const targetSec = (s.start + s.end) / 2;
            state.hoverBin = null;
            state.pinnedBin = Math.max(0, Math.min(tl.bins - 1, Math.floor(targetSec / tl.bin_sec)));
            draw();
            updateDetails();
          };
          pillsWrap.appendChild(pb);
        });
      }

      const card = document.getElementById('sample-card');
      card.style.borderLeftColor = p.sampleStroke;
      card.style.opacity = sampleHit ? '1' : '0.82';
      if (activeSample) {
        document.getElementById('sample-badge').textContent = SAMPLE_TYPE_LABELS[activeSample.type] || activeSample.type;
        document.getElementById('sample-badge').style.color = p.sampleStroke;
        document.getElementById('sample-time').textContent = activeSample.timestamp;
        document.getElementById('sample-speaker').textContent =
          activeSample.identification_confidence === 'HIGH' && activeSample.speaker_or_source
            ? `· ${activeSample.speaker_or_source}`
            : '· Unidentified source';
        document.getElementById('sample-desc').textContent = activeSample.description || '';
        const q = document.getElementById('sample-quote');
        if (activeSample.transcript_excerpt) {
          q.textContent = `"${activeSample.transcript_excerpt}"`;
          q.style.display = 'block';
        } else {
          q.textContent = '';
          q.style.display = 'none';
        }
      }
    }

    function binFromPointer(ev) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width - 1, ev.clientX - rect.left));
      const padL = 8, padR = 8;
      const frac = Math.max(0, Math.min(0.9999, (x - padL) / Math.max(1, rect.width - padL - padR)));
      return Math.floor(frac * currentTrack().timeline.bins);
    }

    canvas.addEventListener('pointermove', (ev) => {
      state.hoverBin = binFromPointer(ev);
      draw();
      updateDetails();
    });
    canvas.addEventListener('pointerleave', () => {
      state.hoverBin = null;
      draw();
      updateDetails();
    });
    canvas.addEventListener('click', (ev) => {
      state.pinnedBin = binFromPointer(ev);
      state.hoverBin = null;
      draw();
      updateDetails();
    });
    canvas.addEventListener('keydown', (ev) => {
      const max = currentTrack().timeline.bins - 1;
      const cur = state.pinnedBin ?? 0;
      if (ev.key === 'ArrowRight') { ev.preventDefault(); state.pinnedBin = Math.min(max, cur + 1); }
      else if (ev.key === 'ArrowLeft') { ev.preventDefault(); state.pinnedBin = Math.max(0, cur - 1); }
      else if (ev.key === 'Home') { ev.preventDefault(); state.pinnedBin = 0; }
      else if (ev.key === 'End') { ev.preventDefault(); state.pinnedBin = max; }
      else return;
      state.hoverBin = null;
      draw();
      updateDetails();
    });

    document.getElementById('btn-grit').onclick = () => {
      state.showGrit = !state.showGrit;
      renderControls();
      draw();
    };
    document.getElementById('btn-pulse').onclick = () => {
      state.showPulse = !state.showPulse;
      renderControls();
      draw();
    };

    window.addEventListener('themechange', () => { renderControls(); draw(); updateDetails(); });
    new ResizeObserver(() => draw()).observe(canvas);

    selectTrack(1);
  </script>
</body>
</html>
